<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周易工具 | WithWind</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-white text-gray-900">
    <main class="pt-28 px-6 pb-20">
        <section class="max-w-5xl mx-auto space-y-4 text-center py-10">
            <p class="text-xs uppercase tracking-[0.3em] text-gray-500">Tools</p>
            <h1 class="text-4xl md:text-5xl font-light tracking-widest">周易工具</h1>
            <p class="text-base md:text-lg text-gray-600">聚合排盘、分析、性格画像与运势走势，快速进入实用场景。</p>
        </section>

        <section class="max-w-5xl mx-auto space-y-12">
            <div class="space-y-4">
                <h2 class="text-sm uppercase tracking-[0.2em] text-gray-500">八字</h2>
                <div class="grid gap-6 md:grid-cols-3">
                    <a href="fate/chart/index.html" class="border border-gray-200 rounded-2xl p-6 space-y-3 transition hover:border-black hover:-translate-y-1">
                        <h3 class="text-lg font-medium">排盘</h3>
                        <p class="text-sm text-gray-600">输入生日与地点，一键生成八字命盘。</p>
                    </a>
                    <a href="fate/analysis/index.html" class="border border-gray-200 rounded-2xl p-6 space-y-3 transition hover:border-black hover:-translate-y-1">
                        <h3 class="text-lg font-medium">分析</h3>
                        <p class="text-sm text-gray-600">基于八字命盘，深度解析命理格局。</p>
                    </a>
                    <a href="fate/fortune/index.html" class="border border-gray-200 rounded-2xl p-6 space-y-3 transition hover:border-black hover:-translate-y-1">
                        <h3 class="text-lg font-medium">运势</h3>
                        <p class="text-sm text-gray-600">查看大运、流年、流月与流日的走势。</p>
                    </a>
                    <a href="fate/character/index.html" class="border border-gray-200 rounded-2xl p-6 space-y-3 transition hover:border-black hover:-translate-y-1">
                        <h3 class="text-lg font-medium">性格</h3>
                        <p class="text-sm text-gray-600">基于八字解析性格特质与天赋倾向。</p>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="../../js/common.js"></script>
</body>
</html>
