<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇门起卦工具 | 随风</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-white text-gray-900">
    <main class="pt-28">




    <!-- Header and Navigation will be loaded by common.js -->
    
    <!-- Main Content -->
    <section class="min-h-screen pt-8 pb-12 px-8">
        <div class="max-w-4xl mx-auto">
            <!-- Title -->
            <div class="text-center mb-8 fade-in">
                <p class="text-xs uppercase tracking-[0.3em] text-gray-500">Qimen</p>
                <h1 class="text-3xl md:text-4xl font-light mt-2">奇门遁甲</h1>
                <p class="text-gray-500 text-sm mt-2">起卦排盘与解读</p>
            </div>
            
            <!-- Form Section -->
            <div class="bg-white border border-gray-200 rounded-3xl shadow-sm mb-8 fade-in">
                <div class="bg-gray-100 text-gray-900 rounded-t-3xl px-6 py-4 flex items-center justify-between">
                    <span class="font-medium tracking-wide">奇门起盘</span>
                    <span class="text-xs opacity-90">起卦原则</span>
                </div>
                <form id="divineForm" class="divide-y divide-gray-100" novalidate>
                    <!-- Name Input -->
                    <div class="px-6 py-4 flex items-center justify-between gap-4">
                        <label for="name" class="text-sm text-gray-700">姓名 <span class="text-gray-400">（选填）</span></label>
                        <input type="text" id="name" name="name"
                               class="w-56 text-right text-sm text-gray-900 placeholder-gray-400 focus:outline-none"
                               placeholder="请输入">
                    </div>
                    
                    <!-- Sex Selection -->
                    <div class="px-6 py-4 flex items-center justify-between gap-4">
                        <span class="text-sm text-gray-700">性别 <span class="text-gray-400">（必填）</span></span>
                        <div class="flex items-center gap-2">
                            <button type="button" class="sex-pill px-4 py-1.5 rounded-full border border-black bg-black text-white text-xs" data-value="1">男</button>
                            <button type="button" class="sex-pill px-4 py-1.5 rounded-full border border-gray-200 text-gray-600 text-xs" data-value="0">女</button>
                        </div>
                        <select id="sex" name="sex" required class="sr-only" aria-hidden="true">
                            <option value="">请选择性别</option>
                            <option value="1">男</option>
                            <option value="0">女</option>
                        </select>
                    </div>
                    
                    <!-- Birthday DateTime -->
                    <fieldset class="px-6 py-4 space-y-3">
                        <legend class="sr-only">出生时间（必填）</legend>
                        <p class="text-sm text-gray-700">出生时间 <span class="text-gray-400">（必填）</span></p>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label for="birthday-year" class="block text-xs text-gray-600 mb-1">年</label>
                                <input type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"
                                       id="birthday-year" name="birthday-year" required placeholder="1990"
                                       aria-describedby="birthdayHint"
                                       class="w-full min-w-0 text-sm text-gray-900 border border-gray-200 rounded-xl px-2 py-2 text-center focus:ring-1 focus:ring-black focus:border-black outline-none transition-colors">
                            </div>
                            <div>
                                <label for="birthday-month" class="block text-xs text-gray-600 mb-1">月</label>
                                <input type="text" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2"
                                       id="birthday-month" name="birthday-month" required placeholder="06"
                                       aria-describedby="birthdayHint"
                                       class="w-full min-w-0 text-sm text-gray-900 border border-gray-200 rounded-xl px-2 py-2 text-center focus:ring-1 focus:ring-black focus:border-black outline-none transition-colors">
                            </div>
                            <div>
                                <label for="birthday-day" class="block text-xs text-gray-600 mb-1">日</label>
                                <input type="text" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2"
                                       id="birthday-day" name="birthday-day" required placeholder="15"
                                       aria-describedby="birthdayHint"
                                       class="w-full min-w-0 text-sm text-gray-900 border border-gray-200 rounded-xl px-2 py-2 text-center focus:ring-1 focus:ring-black focus:border-black outline-none transition-colors">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label for="birthday-hour" class="block text-xs text-gray-600 mb-1">时</label>
                                <input type="text" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2"
                                       id="birthday-hour" name="birthday-hour" required placeholder="08"
                                       aria-describedby="birthdayHint"
                                       class="w-full min-w-0 text-sm text-gray-900 border border-gray-200 rounded-xl px-2 py-2 text-center focus:ring-1 focus:ring-black focus:border-black outline-none transition-colors">
                            </div>
                            <div>
                                <label for="birthday-minute" class="block text-xs text-gray-600 mb-1">分</label>
                                <input type="text" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2"
                                       id="birthday-minute" name="birthday-minute" required placeholder="30"
                                       aria-describedby="birthdayHint"
                                       class="w-full min-w-0 text-sm text-gray-900 border border-gray-200 rounded-xl px-2 py-2 text-center focus:ring-1 focus:ring-black focus:border-black outline-none transition-colors">
                            </div>
                        </div>
                        <p id="birthdayHint" class="text-xs text-gray-500">请填写公历出生时间，小时按24小时制填写（0–23时）。</p>
                    </fieldset>

                    <!-- Optional Fields -->
                    <details class="px-6 py-4">
                        <summary class="cursor-pointer text-sm text-gray-600">更多选项</summary>
                        <div class="mt-4 space-y-4">
                            <!-- Region Selection -->
                            <div>
                                <label for="region-selector" class="block text-sm text-gray-700 mb-2">地区 <span class="text-gray-400">（选填）</span></label>
                                <div id="region-selector" class="space-y-4">
                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div>
                                            <select id="province-select" 
                                                    class="w-full px-4 py-2 border border-gray-300 focus:ring-1 focus:ring-black focus:border-black outline-none transition-colors">
                                                <option value="">请选择省份</option>
                                            </select>
                                        </div>
                                        <div>
                                            <select id="city-select" 
                                                    class="w-full px-4 py-2 border border-gray-300 focus:ring-1 focus:ring-black focus:border-black outline-none transition-colors" 
                                                    disabled>
                                                <option value="">请选择城市</option>
                                            </select>
                                        </div>
                                        <div>
                                            <select id="district-select" 
                                                    class="w-full px-4 py-2 border border-gray-300 focus:ring-1 focus:ring-black focus:border-black outline-none transition-colors" 
                                                    disabled>
                                                <option value="">请选择区县</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div id="selected-region" class="hidden">
                                        <span class="text-sm text-gray-600">已选择：</span>
                                        <span id="region-display" class="text-sm font-medium text-gray-800"></span>
                                    </div>
                                </div>
                                <input type="hidden" id="region" name="region">
                                <input type="hidden" id="region-code" name="regionCode">
                            </div>
                        </div>
                    </details>
                    
                    <!-- Submit Button -->
                    <div class="px-6 py-6">
                        <button id="startDivination" type="submit" 
                                class="w-full rounded-full bg-black text-white py-3 px-6 hover:bg-gray-800 transition-colors duration-200 font-medium">
                            起盘
                        </button>
                    </div>
                </form>
            </div>

            <!-- Loading State -->
            <div id="loadingSection" class="hidden text-center py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-black mb-4"></div>
                <p class="text-gray-600">正在生成奇门命盘，请稍候...</p>
            </div>
            
            <!-- Results Section -->
            <div id="resultsSection" class="hidden space-y-8 fade-in">
                <!-- Chart Image -->
                <div id="chartSection" class="hidden">
                    <h2 class="text-2xl font-light mb-6 text-center">奇门命盘图</h2>
                    <div class="text-center">
                        <img id="chartImage" src="" alt="奇门命盘图" 
                             class="max-w-full mx-auto border border-gray-200 rounded-lg shadow-sm">
                    </div>
                </div>
                
                <!-- Analysis Data -->
                <div id="analysisSection" class="hidden">
                    <h2 class="text-4xl md:text-5xl font-light mb-12 text-center text-gray-800">命盘分析</h2>
                    
                    <!-- Basic Info Template -->
                    <div id="basicInfoTemplate" class="hidden bg-white border border-gray-200 rounded-lg p-8 mb-8 fade-in">
                        <h3 class="text-2xl font-light mb-6 text-gray-800">
                            <span id="personName"></span>（<span id="title"></span>）奇门遁甲命盘排盘信息：
                        </h3>
                        <div class="space-y-4 text-gray-700 leading-relaxed font-light">
                            <div class="text-lg font-light">1、基本信息：</div>
                            <div class="ml-6">生日：<span id="datetimeInfo" class="font-light"></span></div>
                            <div class="ml-6">干支：<span id="ganZhiInfo" class="font-light"></span></div>
                            <div class="ml-6">选局：<span id="pattern" class="font-light"></span></div>
                            <div class="ml-6">旬首：<span id="xunHead" class="font-light"></span></div>
                            <div class="ml-6">值符：<span id="dutyStar" class="font-light"></span></div>
                            <div class="ml-6">值使：<span id="dutyDoor" class="font-light"></span></div>
                            <div class="ml-6">局势：<span id="layout" class="font-light">转盘-拆补-寄坤二宫</span></div>
                            <div class="ml-6">上一个节气：<br/><span id="lastSolarTerm" class="font-light"></span></div>
                            <div class="ml-6">下一个节气：<br/><span id="nextSolarTerm" class="font-light"></span></div>
                        </div>
                    </div>
                    
                    <!-- Palace Info Template -->
                    <div id="palaceInfoTemplate" class="hidden bg-white border border-gray-200 rounded-lg p-8 fade-in">
                        <h3 class="text-2xl font-light mb-6 text-gray-800">2、八宫信息：</h3>
                        <div id="palaceList" class="space-y-3 text-gray-700 leading-relaxed"></div>
                    </div>
                    
                    <!-- No Data Message -->
                    <div id="noDataMessage" class="hidden bg-white border border-gray-200 rounded-lg p-12 text-center fade-in">
                        <p class="text-gray-500 text-lg">暂无分析数据，请稍后重试</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    
    <script>
        // Region data and selection functionality
        let regionData = [];
        let selectedProvince = null;
        let selectedCity = null;
        let selectedDistrict = null;
        
        // Load region data from JSON file
        async function loadRegionData() {
            try {
                const response = await fetch('./region.json');
                if (!response.ok) {
                    throw new Error('Failed to load region data');
                }
                regionData = await response.json();
                console.log('✅ Region data loaded:', regionData.length, 'regions');
                initializeProvinceSelector();
            } catch (error) {
                console.error('❌ Failed to load region data:', error);
            }
        }
        
        // Initialize province selector
        function initializeProvinceSelector() {
            const provinces = regionData.filter(region => region.parentId === 0);
            const provinceSelect = document.getElementById('province-select');
            
            provinces.forEach(province => {
                const option = document.createElement('option');
                option.value = province.code;
                option.textContent = province.name;
                option.dataset.id = province.id;
                provinceSelect.appendChild(option);
            });
            
            // Add change event listener
            provinceSelect.addEventListener('change', handleProvinceChange);
        }
        
        // Handle province selection
        function handleProvinceChange() {
            const provinceSelect = document.getElementById('province-select');
            const citySelect = document.getElementById('city-select');
            const districtSelect = document.getElementById('district-select');
            
            // Reset city and district selections
            citySelect.innerHTML = '<option value="">请选择城市</option>';
            districtSelect.innerHTML = '<option value="">请选择区县</option>';
            citySelect.disabled = true;
            districtSelect.disabled = true;
            
            selectedProvince = null;
            selectedCity = null;
            selectedDistrict = null;
            
            const selectedProvinceCode = provinceSelect.value;
            if (!selectedProvinceCode) {
                updateRegionDisplay();
                return;
            }
            
            // Find selected province
            selectedProvince = regionData.find(region => region.code === selectedProvinceCode);
            
            // Load cities for this province
            const cities = regionData.filter(region => 
                region.parentId === selectedProvince.id
            );
            
            cities.forEach(city => {
                const option = document.createElement('option');
                option.value = city.code;
                option.textContent = city.name;
                option.dataset.id = city.id;
                citySelect.appendChild(option);
            });
            
            citySelect.disabled = false;
            citySelect.addEventListener('change', handleCityChange);
            updateRegionDisplay();
        }
        
        // Handle city selection
        function handleCityChange() {
            const citySelect = document.getElementById('city-select');
            const districtSelect = document.getElementById('district-select');
            
            // Reset district selection
            districtSelect.innerHTML = '<option value="">请选择区县</option>';
            districtSelect.disabled = true;
            
            selectedCity = null;
            selectedDistrict = null;
            
            const selectedCityCode = citySelect.value;
            if (!selectedCityCode) {
                updateRegionDisplay();
                return;
            }
            
            // Find selected city
            selectedCity = regionData.find(region => region.code === selectedCityCode);
            
            // Load districts for this city
            const districts = regionData.filter(region => 
                region.parentId === selectedCity.id
            );
            
            if (districts.length > 0) {
                districts.forEach(district => {
                    const option = document.createElement('option');
                    option.value = district.code;
                    option.textContent = district.name;
                    option.dataset.id = district.id;
                    districtSelect.appendChild(option);
                });
                districtSelect.disabled = false;
                districtSelect.addEventListener('change', handleDistrictChange);
            }
            
            updateRegionDisplay();
        }
        
        // Handle district selection
        function handleDistrictChange() {
            const districtSelect = document.getElementById('district-select');
            const selectedDistrictCode = districtSelect.value;
            
            if (!selectedDistrictCode) {
                selectedDistrict = null;
            } else {
                selectedDistrict = regionData.find(region => region.code === selectedDistrictCode);
            }
            
            updateRegionDisplay();
        }
        
        // Update region display and hidden inputs
        function updateRegionDisplay() {
            const regionDisplay = document.getElementById('region-display');
            const selectedRegionDiv = document.getElementById('selected-region');
            const regionInput = document.getElementById('region');
            const regionCodeInput = document.getElementById('region-code');
            
            let regionNames = [];
            let regionCode = '';
            
            if (selectedProvince) {
                regionNames.push(selectedProvince.name);
                regionCode = selectedProvince.code;
            }
            
            if (selectedCity) {
                regionNames.push(selectedCity.name);
                regionCode = selectedCity.code;
            }
            
            if (selectedDistrict) {
                regionNames.push(selectedDistrict.name);
                regionCode = selectedDistrict.code;
            }
            
            if (regionNames.length > 0) {
                regionDisplay.textContent = regionNames.join('-');
                selectedRegionDiv.classList.remove('hidden');
                regionInput.value = regionNames.join('-');
                regionCodeInput.value = regionCode;
                console.log('📍 Region selected:', regionNames.join('-'), 'Code:', regionCode);
            } else {
                selectedRegionDiv.classList.add('hidden');
                regionInput.value = '';
                regionCodeInput.value = '';
            }
        }
        
        const birthdayInputs = ['year', 'month', 'day', 'hour', 'minute'].map(part =>
            document.getElementById(`birthday-${part}`)
        );
        birthdayInputs.forEach(input => {
            input.addEventListener('input', function() {
                birthdayInputs.forEach(field => field.setCustomValidity(''));
            });
        });

        // Form submission handler
        document.getElementById('divineForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value.trim(),
                sex: document.getElementById('sex').value,
                region: document.getElementById('region').value.trim(),
                regionCode: document.getElementById('region-code').value.trim(),
            };
            
            // Validate required fields are filled
            if (birthdayInputs.some(input => !input.value.trim()) || !formData.sex) {
                alert('请填写所有必填字段（生日、性别）');
                return;
            }
            
            const values = birthdayInputs.map(input => input.value.trim());
            const [year, month, day, hour, minute] = values.map(Number);
            const leapYear = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
            const daysInMonth = [31, leapYear ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            const validFormat = /^\d{4}$/.test(values[0]) && values.slice(1).every(value => /^\d{1,2}$/.test(value));
            const invalidIndex = !validFormat || year < 1 ? 0 :
                month < 1 || month > 12 ? 1 :
                day < 1 || day > daysInMonth[month - 1] ? 2 :
                hour > 23 ? 3 : minute > 59 ? 4 : -1;
            if (invalidIndex !== -1) {
                const invalidInput = birthdayInputs[invalidIndex];
                invalidInput.setCustomValidity('请填写有效的公历日期和时间，小时为0–23，分钟为0–59。');
                invalidInput.reportValidity();
                return;
            }
            const pad = value => String(value).padStart(2, '0');
            const analysisTimeFormat = `${values[0]}-${pad(month)}-${pad(day)} ${pad(hour)}:${pad(minute)}`;

            // Show loading
            document.getElementById('loadingSection').classList.remove('hidden');
            document.getElementById('resultsSection').classList.add('hidden');
            
            try {
                // Debug: Log form data
                console.log('📤 Form Data:', formData);
                console.log('🕐 Analysis Time Format:', analysisTimeFormat);
                
                // Build API URLs
                let chartUrl, analysisUrl;
                const baseUrl = 'https://app.withwind.run';
                const chartParams = new URLSearchParams();
                chartParams.set('divineTime', analysisTimeFormat);
                if (formData.regionCode) {
                    chartParams.set('region', formData.regionCode);
                }

                const analysisParams = new URLSearchParams();
                analysisParams.set('birthday', analysisTimeFormat);
                analysisParams.set('sex', formData.sex);
                if (formData.name) {
                    analysisParams.set('name', formData.name);
                }
                if (formData.regionCode) {
                    analysisParams.set('region', formData.regionCode);
                }

                chartUrl = `${baseUrl}/zhouyi/qimen/divine/chart?${chartParams.toString()}`;
                analysisUrl = `${baseUrl}/zhouyi/qimen/analyzeForJiang?${analysisParams.toString()}`;
                
                console.log('🔗 Chart URL:', chartUrl);
                console.log('🔗 Analysis URL:', analysisUrl);
                
                // Make API calls in parallel
                const [chartResponse, analysisResponse] = await Promise.all([
                    fetch(chartUrl),
                    fetch(analysisUrl)
                ]);
                
                console.log('📊 Chart Response Status:', chartResponse.status, chartResponse.statusText);
                console.log('📊 Analysis Response Status:', analysisResponse.status, analysisResponse.statusText);
                
                // Handle chart image
                if (chartResponse.ok) {
                    console.log('✅ Chart API successful');
                    const chartBlob = await chartResponse.blob();
                    console.log('🖼️ Chart blob size:', chartBlob.size, 'bytes');
                    
                    if (chartBlob.size > 0) {
                        const chartImageUrl = URL.createObjectURL(chartBlob);
                        document.getElementById('chartImage').src = chartImageUrl;
                        document.getElementById('chartSection').classList.remove('hidden');
                    } else {
                        console.warn('⚠️ Chart image is empty');
                    }
                } else {
                    console.error('❌ Chart API failed:', chartResponse.status, chartResponse.statusText);
                    const errorText = await chartResponse.text();
                    console.error('Chart Error Response:', errorText);
                }
                
                // Handle analysis data
                if (analysisResponse.ok) {
                    console.log('✅ Analysis API successful');
                    const analysisData = await analysisResponse.json();
                    console.log('📋 Analysis Data:', analysisData);
                    
                    displayAnalysisData(analysisData);
                    document.getElementById('analysisSection').classList.remove('hidden');
                } else {
                    console.error('❌ Analysis API failed:', analysisResponse.status, analysisResponse.statusText);
                    const errorText = await analysisResponse.text();
                    console.error('Analysis Error Response:', errorText);
                }
                
                // Show results and hide loading
                document.getElementById('loadingSection').classList.add('hidden');
                document.getElementById('resultsSection').classList.remove('hidden');
                
            } catch (error) {
                console.error('💥 API request failed:', error);
                document.getElementById('loadingSection').classList.add('hidden');
                alert('排盘请求失败：' + error.message);
            }
        });
        
        function displayAnalysisData(data) {
            console.log('🎨 开始解析数据:', data);
            
            // Hide all templates first
            document.getElementById('basicInfoTemplate').classList.add('hidden');
            document.getElementById('palaceInfoTemplate').classList.add('hidden');
            document.getElementById('noDataMessage').classList.add('hidden');
            
            // 如果数据为空或无效，显示提示信息
            if (!data || (typeof data !== 'object')) {
                console.warn('⚠️ 数据为空或格式错误:', data);
                document.getElementById('noDataMessage').classList.remove('hidden');
                return;
            }
            
            // 处理基本信息
            if (data.baseInfo) {
                const base = data.baseInfo;
                
                // 填充基本信息
                document.getElementById('personName').textContent = base.personName || '';
                document.getElementById('title').textContent = base.sex || '';
                
                // 填充日期时间信息
                const datetimeInfo = document.getElementById('datetimeInfo');
                let datetimeHtml = '';
                if (base.solarBirthday) {
                    datetimeHtml += `<p>公历 ${base.solarBirthday}`;
                    if (base.lunarBirthday) {
                        datetimeHtml += `<br>农历 ${base.lunarBirthday}`;
                    }
                    if (base.apparentSolarTime) {
                        datetimeHtml += `<br>真太阳时 ${base.apparentSolarTime}`;
                    }
                    datetimeHtml += '</p>';
                }
                datetimeInfo.innerHTML = datetimeHtml;
                
                // 填充干支信息
                const ganZhiInfo = document.getElementById('ganZhiInfo');
                let ganZhiHtml = '';
                if (base.ganZhiBirthday) {
                    ganZhiHtml += '<p>四柱：';
                    ganZhiHtml += `年柱/${base.ganZhiBirthday.ganZhiYear?.name || ''} `;
                    ganZhiHtml += `月柱/${base.ganZhiBirthday.ganZhiMonth?.name || ''} `;
                    ganZhiHtml += `日柱/${base.ganZhiBirthday.ganZhiDay?.name || ''} `;
                    ganZhiHtml += `时柱/${base.ganZhiBirthday.ganZhiTime?.name || ''}`;
                    ganZhiHtml += '</p>';
                }
                ganZhiInfo.innerHTML = ganZhiHtml;
                
                // 填充其他信息
                document.getElementById('pattern').textContent = base.pattern || '';
                document.getElementById('xunHead').textContent = base.xunHead || '';
                document.getElementById('dutyStar').textContent = base.dutyStar || '';
                document.getElementById('dutyDoor').textContent = base.dutyDoor || '';
                
                // 处理节气
                document.getElementById('lastSolarTerm').textContent = 
                    base.lastSolarTerm ? `${base.lastSolarTerm.name || ''} ${base.lastSolarTerm.dateTime || ''}` : '';
                document.getElementById('nextSolarTerm').textContent = 
                    base.nextSolarTerm ? `${base.nextSolarTerm.name || ''} ${base.nextSolarTerm.dateTime || ''}` : '';
                
                // 显示基本信息模板
                document.getElementById('basicInfoTemplate').classList.remove('hidden');
            }
            
            // 处理八宫信息
            if (data.palaceInfo) {
                const palaceList = document.getElementById('palaceList');
                let palaceHtml = '';
                
                const orderSeq = ["巽四宫", "离九宫", "坤二宫", "兑七宫", "乾六宫", "坎一宫", "艮八宫", "震三宫"];
                
                orderSeq.forEach(palaceName => {
                    const palace = data.palaceInfo[palaceName];
                    if (palace) {
                        const doorName = palace.door?.fullName || palace.door?.name || '';
                        const starName = palace.star?.name || palace.star?.shortName || '';
                        const deityName = palace.deity?.name || palace.deity?.shortName || '';
                        const tGan = palace.heaven?.gan?.name || '';
                        const tStat = palace.heaven?.statuses || '';
                        const dGan = palace.ground?.gan?.name || '';
                        const dStat = palace.ground?.statuses || '';
                        
                        const isKongWang = (palace.isTimeEmpty);
                        const isMaXing = palace.isHorse || false;
                        const isRuMu = (palace.ground?.isEnterTomb) || (dStat?.includes('墓'));
                        const isNative = palace.isNative || false;
                        
                        palaceHtml += `<p><strong class="font-light">${palaceName}：</strong>${doorName}/${starName}/${deityName} 天${tGan}`;
                        if (tStat) palaceHtml += `<span class="text-gray-600 font-light">【${tStat}】</span>`;
                        palaceHtml += `/地${dGan}`;
                        if (dStat) palaceHtml += `<span class="text-gray-600 font-light">【${dStat}】</span>`;
                        if (isKongWang) palaceHtml += ' <span class="text-gray-700 font-medium">空亡</span>';
                        if (isMaXing) palaceHtml += ' <span class="text-gray-700 font-medium">马星</span>';
                        if (isRuMu) palaceHtml += ' <span class="text-gray-700 font-medium">入墓</span>';
                        if (isNative) palaceHtml += ' （<span class="text-gray-700 font-medium">本宫</span>）';
                        palaceHtml += '</p>';
                    }
                });
                
                palaceList.innerHTML = palaceHtml;
                document.getElementById('palaceInfoTemplate').classList.remove('hidden');
            }
            
            console.log('✅ 数据解析完成并显示');
        }
        
            const sexButtons = document.querySelectorAll('.sex-pill');
            const sexInput = document.getElementById('sex');
            sexButtons.forEach((button) => {
                button.addEventListener('click', () => {
                    sexButtons.forEach((btn) => {
                        btn.classList.remove('bg-black', 'text-white', 'border-black');
                        btn.classList.add('border-gray-200', 'text-gray-600');
                    });
                    button.classList.add('bg-black', 'text-white', 'border-black');
                    button.classList.remove('border-gray-200', 'text-gray-600');
                    sexInput.value = button.dataset.value;
                });
            });

            // Initialize on page load
            document.addEventListener('DOMContentLoaded', function() {
                // Ensure default sex matches UI
                if (sexInput && !sexInput.value) {
                    sexInput.value = '1';
                }

                // Load region data
                loadRegionData();
            
            // Initialize fade-in animations
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };
            
            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, observerOptions);
            
            document.querySelectorAll('.fade-in').forEach(el => {
                observer.observe(el);
            });
        });
    </script>
    </main>
